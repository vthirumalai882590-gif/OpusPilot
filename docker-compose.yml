version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://opspilot:opspilotpass@postgres:5432/opspilotdb
      - AI_PROVIDER=mock
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8001
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8001
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilotpass
      POSTGRES_DB: opspilotdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
